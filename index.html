<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BABY - Visor Papá</title>
<style>body{margin:0;background:#000;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;height:100vh}#box{flex:1;background:#111;display:flex;align-items:center;justify-content:center}video{width:100%;height:100%;object-fit:cover}#ct{background:#1c1c1c;padding:14px;border-radius:18px 18px 0 0}#bar{height:12px;background:#333;border-radius:10px;overflow:hidden;margin:8px 0}#fill{height:100%;width:0%;background:#22c55e;transition:width.2s}input{width:100%;box-sizing:border-box;height:48px;border-radius:10px;border:0;padding:0 12px;margin-bottom:8px;font-weight:700}button{width:100%;height:50px;border-radius:12px;border:0;font-weight:900}</style>
</head>
<body>
<div id="box"><video id="remote" autoplay playsinline></video></div>
<div id="ct">
  <input id="sala" placeholder="Pega aquí el código ej: sala_a1b2c">
  <div id="bar"><div id="fill"></div></div>
  <div id="msg" style="text-align:center;font-size:12px">Esperando conexión...</div>
  <button onclick="conectar()" style="background:#fff;color:#000;margin-top:8px">CONECTAR Y VER</button>
</div>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDvetl-4f68ykb5GpGSZtCAvOeetKmnh-4",
  authDomain: "menu-digital-12e66.firebaseapp.com",
  databaseURL: "https://menu-digital-12e66-default-rtdb.firebaseio.com",
  projectId: "menu-digital-12e66",
  storageBucket: "menu-digital-12e66.firebasestorage.app",
  messagingSenderId: "388372771516",
  appId: "1:388372771516:web:516a80aeeecc1ab8f756b9",
  measurementId: "G-SBDX42X17X"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let pc, remoteStream;
async function conectar(){
  const salaId=document.getElementById('sala').value.trim(); if(!salaId) return alert('Escribe el código');
  const ref=db.collection('kigo_baby_test').doc(salaId); const doc=await ref.get(); if(!doc.exists) return alert('Código no existe');
  pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
  pc.ontrack=e=>{document.getElementById('remote').srcObject=e.streams[0]; remoteStream=e.streams[0]; detectarLlanto();};
  pc.onicecandidate=e=>{if(e.candidate) ref.collection('answerer').add(e.candidate.toJSON());};
  await pc.setRemoteDescription(new RTCSessionDescription(doc.data().offer));
  const ans=await pc.createAnswer(); await pc.setLocalDescription(ans);
  await ref.update({answer:{type:ans.type,sdp:ans.sdp}});
  ref.collection('caller').onSnapshot(s=>{s.docChanges().forEach(async c=>{if(c.type==='added') await pc.addIceCandidate(new RTCIceCandidate(c.doc.data()));});});
  document.getElementById('msg').innerText="Conectado - escuchando...";
}
function detectarLlanto(){
  const ctx=new (window.AudioContext||window.webkitAudioContext)(); const src=ctx.createMediaStreamSource(remoteStream); const an=ctx.createAnalyser(); an.fftSize=256; src.connect(an); const d=new Uint8Array(an.frequencyBinCount);
  setInterval(()=>{an.getByteFrequencyData(d); let p=d.reduce((a,b)=>a+b,0)/d.length; let porc=Math.min(100,p*1.6); document.getElementById('fill').style.width=porc+'%'; document.getElementById('fill').style.background=porc>70?'#ef4444':'#22c55e'; document.getElementById('msg').innerText=porc>70?'¡BEBÉ LLORANDO! 🔔':'Todo tranquilo - '+Math.round(porc)+'% ruido'; if(porc>75 && navigator.vibrate) navigator.vibrate([300,100,300]);},250);
}
</script>
</body>
</html>
