<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIGO BABY - Visor Papá</title>
<style>body{margin:0;background:#000;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;height:100vh}#box{flex:1;background:#111;display:flex;align-items:center;justify-content:center;position:relative}video{width:100%;height:100%;object-fit:cover}#controls{background:#1a1a1a;padding:16px;border-radius:20px 20px 0 0}#bar{height:14px;background:#333;border-radius:10px;overflow:hidden;margin:10px 0}#fill{height:100%;width:0%;background:#22c55e}button{width:100%;height:50px;border-radius:12px;border:0;font-weight:800}</style>
</head>
<body>
<div id="box"><video id="remoteVideo" autoplay playsinline></video></div>
<div id="controls">
  <input id="inputSala" placeholder="Escribe el código de la sala (ej: sala_a1b2c3)" style="width:100%;height:45px;border-radius:10px;border:0;padding:0 12px;margin-bottom:10px">
  <div id="bar"><div id="fill"></div></div>
  <div id="txt" style="font-size:12px;text-align:center">Silencio</div>
  <button onclick="ver()" style="background:#fff;color:#000;margin-top:10px">VER A MI BEBÉ</button>
</div>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = { apiKey: "TU_API_KEY", projectId: "TU_PROJECT_ID", };
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let pc, remoteStream, audioContext, analyser;

async function ver(){
  const salaId = document.getElementById('inputSala').value.trim();
  if(!salaId) return alert('Escribe el código que sale en el otro celular');
  const salaRef = db.collection('kigo_baby').doc(salaId);
  const sala = (await salaRef.get()).data();
  if(!sala) return alert('Sala no existe');

  pc = new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
  pc.ontrack = e => {
    document.getElementById('remoteVideo').srcObject = e.streams[0];
    remoteStream = e.streams[0];
    iniciarDeteccionLlanto();
  };
  pc.onicecandidate = e => { if(e.candidate) salaRef.collection('answerer').add(e.candidate.toJSON()); }

  await pc.setRemoteDescription(new RTCSessionDescription(sala.offer));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  await salaRef.update({answer:{type:answer.type, sdp:answer.sdp}});

  salaRef.collection('caller').onSnapshot(snap=>{
    snap.docChanges().forEach(async c=>{ if(c.type==='added') await pc.addIceCandidate(new RTCIceCandidate(c.doc.data())); });
  });
}

function iniciarDeteccionLlanto(){
  audioContext = new AudioContext();
  const src = audioContext.createMediaStreamSource(remoteStream);
  analyser = audioContext.createAnalyser();
  analyser.fftSize=256;
  src.connect(analyser);
  const data = new Uint8Array(analyser.frequencyBinCount);
  setInterval(()=>{
    analyser.getByteFrequencyData(data);
    let promedio = data.reduce((a,b)=>a+b,0)/data.length;
    let porc = Math.min(100, promedio*1.5);
    document.getElementById('fill').style.width=porc+'%';
    document.getElementById('fill').style.background=porc>70?'#ef4444':'#22c55e';
    document.getElementById('txt').innerText=porc>70?'¡BEBÉ LLORANDO! 🔊':'Silencio - Todo bien';
    if(porc>70 && navigator.vibrate) navigator.vibrate([300,100,300]);
  },200);
}
</script>
</body>
</html>
